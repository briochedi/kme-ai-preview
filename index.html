  <script type="application/json" id="offline-content">{"edition":"2026.11.05","items":[{"id":"wx-01","channel":"wechat","title":"研究发现：老师和学生对AI使用的看法大不同","cover":"img/02_714622b0ec.png","html":"\u003c!doctype html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\u003ctitle\u003e研究发现：老师和学生对AI使用的看法大不同\u003c/title\u003e\u003cstyle\u003ebody{margin:0;background:#fff;color:#29262F;font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",sans-serif}*{box-sizing:border-box}article{max-width:680px;margin:auto;padding:24px 20px 36px;overflow-wrap:anywhere;font-size:17px;line-height:1.95}img{max-width:100%;height:auto}a{color:#7C4892;overflow-wrap:anywhere}p:has(img){text-align:left!important}blockquote p{text-align:left!important}table{max-width:100%}table p{font-size:inherit!important;line-height:1.8!important;margin:0!important}table span{font-size:inherit!important}h1,h2,h3{white-space:normal;overflow-wrap:anywhere;word-break:normal}h2,h3{break-after:avoid}@media(max-width:360px){article{padding-left:16px;padding-right:16px}h1{font-size:25px!important}}\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\u003carticle data-kme-layout=\"wechat-unified-v2\"\u003e\u003ch1 style=\"font-size:28px;line-height:1.5;font-weight:700;color:#29262F;margin:0 0 20px;padding:0;border:0;background:transparent;text-align:left;\"\u003e研究发现：老师和学生对AI使用的看法大不同\u003c/h1\u003e\u003csection data-unified-body=\"true\"\u003e\n  \u003cdiv id=\"output\" style=\"font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;max-width:100%;min-width:0;\"\u003e\n\u003csection class=\"container\" style=\"font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;max-width:100%;min-width:0;\"\u003e\u003cp style=\"margin:0 0 26px;padding:0;text-align:left;\"\u003e\u003cimg src=\"img/02_714622b0ec.png\" alt=\"本文主题概念封面\" style=\"display:block;width:100%;height:auto;margin:0;border:0;border-radius:0;\"\u003e\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e学生看重AI带来的帮助，老师却未必同样乐观。两边的分歧，只是“愿不愿意接受新技术”这么简单吗？\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e2026年11月4日，英国曼彻斯特大学介绍了一项有关高校AI使用的研究。研究显示，\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e学生更看好生成式AI可能带来的收益\u003c/strong\u003e；教职员对学生在学业中使用AI，则持有更多负面看法。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e该研究于2026年9月发表在《Frontiers in Education》。两份问卷在2024年4至6月进行，调查来自英国一所研究型大学的一个学院，收集45份教职员和86份学生完整答卷，另有部分答卷。结果对应这所大学、这个学院和当时的受访者。\u003c/p\u003e\u003cp style=\"margin:0 0 12px;padding:0;text-align:left;\"\u003e\u003cimg src=\"img/03_06ef06db61.png\" alt=\"研究时间、范围与完整答卷数量\" style=\"display:block;width:100%;height:auto;margin:0;border:0;border-radius:0;\"\u003e\u003c/p\u003e\u003cp style=\"font-size:12px;line-height:1.8;color:#77717E;margin:0 0 24px;text-align:left;overflow-wrap:anywhere;\" data-kme-source=\"caption\"\u003e\u003cspan style=\"display:block;font-size:12px;line-height:1.8;color:#77717e;\"\u003e研究范围：2024年4—6月，英国一所研究型大学的一个学院；45份教职员、86份学生完整答卷，另有部分答卷。\u003c/span\u003e\u003c/p\u003e\u003ch2 data-kme-heading=\"plain\" style=\"font-size:20px;line-height:1.6;font-weight:700;color:#6A237A;margin:36px 0 18px;padding:0;border:0;background:transparent;text-align:left;\"\u003e学生看到的多是AI的积极帮助\u003c/h2\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e学生对AI的积极期待，涉及支持学科学习、提高效率和减轻负担。问卷中较清楚呈现的学生用途，则集中在语言表达与文本生产。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e在研究采用的1—7分“负面态度”量表上，\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e教职员的平均分为4.93，学生为4.10。\u003c/strong\u003e分值越高，表示对学生在学业中使用AI的负面态度越强。\u003c/p\u003e\u003cp style=\"margin:0 0 12px;padding:0;text-align:left;\"\u003e\u003cimg src=\"img/04_9f39ca7ed5.png\" alt=\"师生负面态度量表的报告均值\" style=\"display:block;width:100%;height:auto;margin:0;border:0;border-radius:0;\"\u003e\u003c/p\u003e\u003cp style=\"font-size:12px;line-height:1.8;color:#77717E;margin:0 0 24px;text-align:left;overflow-wrap:anywhere;\" data-kme-source=\"caption\"\u003e\u003cspan style=\"display:block;font-size:12px;line-height:1.8;color:#77717e;\"\u003e1—7分量表的组别平均分；分值越高，表示负面态度越强。不是使用率或学习效果。依据论文报告数据整理。\u003c/span\u003e\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e这组评分记录了受访者对AI使用的态度。研究还发现，教职员内部在使用经验、熟悉程度，以及对AI用途的看法上，都存在差异。讨论这项结果时，需要同时看到组别之间和组别内部的不同。\u003c/p\u003e\u003ch2 data-kme-heading=\"plain\" style=\"font-size:20px;line-height:1.6;font-weight:700;color:#6A237A;margin:36px 0 18px;padding:0;border:0;background:transparent;text-align:left;\"\u003e使用经验，是作者提出的一条解释\u003c/h2\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e按论文报告，在截至2024年5月的前6个月里，63%的受访教职员用过至少一种生成式AI工具。生成式AI工具的付费订阅比例，教职员为14%，学生为21%。\u003c/p\u003e\u003cp style=\"margin:0 0 12px;padding:0;text-align:left;\"\u003e\u003cimg src=\"img/05_a2044c70e8.png\" alt=\"2024年受访师生生成式AI付费订阅比例\" style=\"display:block;width:100%;height:auto;margin:0;border:0;border-radius:0;\"\u003e\u003c/p\u003e\u003cp style=\"font-size:12px;line-height:1.8;color:#77717E;margin:0 0 24px;text-align:left;overflow-wrap:anywhere;\" data-kme-source=\"caption\"\u003e\u003cspan style=\"display:block;font-size:12px;line-height:1.8;color:#77717e;\"\u003e2024年问卷报告的付费订阅比例，坐标范围0—100%。订阅仅是接触工具的间接线索，不代表AI能力或开明用户情况。\u003c/span\u003e\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e作者把\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e付费订阅视为持续接触工具的一条间接线索\u003c/strong\u003e，借此讨论师生是否接触到了不同的实际用途与限制。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e论文提出，\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e学生更持续地接触工具，可能有助于解释他们对AI的积极评价。\u003c/strong\u003e作者也保留了其他解释，例如学生可能整体上更积极地看待数字技术。订阅情况不能单独说明谁更懂AI，这项问卷也没有确认某一个因素就是态度差异的原因。\u003c/p\u003e\u003ch2 data-kme-heading=\"plain\" style=\"font-size:20px;line-height:1.6;font-weight:700;color:#6A237A;margin:36px 0 18px;padding:0;border:0;background:transparent;text-align:left;\"\u003e师生之间，还隔着使用过程\u003c/h2\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e论文指出，学生可能在独立学习中使用AI，教师未必能看到这个过程。\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e仅凭最终稿，教师不容易判断学生是否使用过AI。\u003c/strong\u003e这限制了教师对学生实际用法的了解。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e研究者因此把高校面对的挑战放在师生关系中讨论。技术培训和AI素养教育之外，还需要关注师生如何理解AI，以及这种理解怎样影响教学和评价。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e研究作者、曼彻斯特大学教育学高级讲师Mark Carrigan在校方报道中提出，要“走出怀疑的氛围”（译）。他希望讨论更多关注怎样恰当地用AI支持学习，同时重新思考教学和评价。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e了解AI在学习中起了什么作用，也需要看它如何参与一份具体的作业。师生交流时，学生可以说明写作过程，老师也可以结合文本线索进一步了解。深侬科技的开明AIGC检测提供这方面的分析参考：机构版报告呈现AIGC占比和段落片段标注，供老师对照原文查看。\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e检测结果应作为参考依据，并配套申诉与复核。\u003c/strong\u003e报告中的线索，需要与学生说明和具体课程要求一并考虑。\u003c/p\u003e\n    \n  \n    \n  \n    \n  \u003c/section\u003e\n  \u003c/div\u003e\n\u003csection data-kme-brand style=\"border-top:1px solid #E8DFED;margin:34px 0 0;padding:23px 0 5px;\"\u003e\u003cp style=\"font-size:14px;line-height:1.8;color:#7C4892;margin:0 0 8px;\"\u003e深侬科技 · 开明\u003c/p\u003e\u003cp style=\"font-size:14px;line-height:1.8;color:#7C4892;margin:0 0 8px;\"\u003eAIGC检测与内容治理观察\u003c/p\u003e\u003c/section\u003e\u003c/section\u003e\u003c/article\u003e\u003c/body\u003e\u003c/html\u003e","number":1},{"id":"wx-02","channel":"wechat","title":"AIGC检测工具汇总","cover":"img/06_86a6cc3fae.png","html":"\u003c!doctype html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\u003ctitle\u003eAIGC检测工具汇总\u003c/title\u003e\u003cstyle\u003ebody{margin:0;background:#fff;color:#29262F;font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",sans-serif}*{box-sizing:border-box}article{max-width:680px;margin:auto;padding:24px 20px 36px;overflow-wrap:anywhere;font-size:17px;line-height:1.95}img{max-width:100%;height:auto}a{color:#7C4892;overflow-wrap:anywhere}p:has(img){text-align:left!important}blockquote p{text-align:left!important}table{max-width:100%}table p{font-size:inherit!important;line-height:1.8!important;margin:0!important}table span{font-size:inherit!important}h1,h2,h3{white-space:normal;overflow-wrap:anywhere;word-break:normal}h2,h3{break-after:avoid}@media(max-width:360px){article{padding-left:16px;padding-right:16px}h1{font-size:25px!important}}\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\u003carticle data-kme-layout=\"wechat-unified-v2\"\u003e\u003ch1 style=\"font-size:28px;line-height:1.5;font-weight:700;color:#29262F;margin:0 0 20px;padding:0;border:0;background:transparent;text-align:left;\"\u003eAIGC检测工具汇总\u003c/h1\u003e\u003csection data-unified-body=\"true\"\u003e\u003csection data-original-transcript style=\"font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;max-width:100%;min-width:0;\"\u003e\n  \u003cdiv id=\"output\" style=\"font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;ma font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;max-width:100%;min-width:0;\"\u003e\n\u003csection class=\"container\" style=\"font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;max-width:100%;min-width:0;\"\u003e\u003cp style=\"margin:0 0 26px;padding:0;text-align:left;\"\u003e\u003cimg src=\"img/07_247d445d39.png\" alt=\"用AI查AI率 真的靠谱吗？\" style=\"display:block;width:100%;height:auto;margin:0;border:0;border-radius:0;\"\u003e\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e《荷塘月色》被检出六成AI率、《滕王阁序》近100%、学生原创论文屡遭误判、真AI生成文字却检测不出、不同平台检测结果差距甚远……当高校将AI检测与毕业资格挂钩，“用AI查AI”真的靠谱吗？\u003c/p\u003e\u003ch2 data-kme-heading=\"plain\" style=\"font-size:20px;line-height:1.6;font-weight:700;color:#6A237A;margin:36px 0 18px;padding:0;border:0;background:transparent;text-align:left;\"\u003e用AI测AI：一个无法绕开的技术悖论\u003c/h2\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003eAI检测的核心逻辑并不复杂：分析文本的词汇词频、句式结构、逻辑表达等特征，将其与AI模型输出内容进行拟合，从而判断相似度。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e但这套逻辑面临一个根本性的悖论——\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003eAI生成内容本身就是对人类语言的模仿\u003c/strong\u003e，它追求规范性、逻辑性，而这恰恰与学术写作的要求高度重合。正如《天津社会科学》主编时世平所指出的：学术写作追求的语言规范、逻辑严谨，与AI生成的底层逻辑高度重合。\u003c/p\u003e\u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e“越是文笔流畅、逻辑清晰的文本，越容易触发‘AI生成’警报。学术表达的优质特征，反而成了被误判的‘罪证’。”\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e——《天津社会科学》主编 时世平\u003c/p\u003e\u003c/blockquote\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e复旦大学计算与智能创新学院教授陈阳进一步解释：大语言模型在预训练和微调阶段，都会使用人类创作的语料作为输入。因此，\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e“大模型生成的内容和人类创作的内容客观上存在雷同的可能”\u003c/strong\u003e。AI检测的难度，远大于传统的论文查重。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003eAI检测的准确度与传统的论文查重相比，更是无法相提并论。仅仅用一纸AI检测结果来评判学生是否能够毕业，真的合理吗？\u003c/p\u003e\u003ch2 data-kme-heading=\"plain\" style=\"font-size:20px;line-height:1.6;font-weight:700;color:#6A237A;margin:36px 0 18px;padding:0;border:0;background:transparent;text-align:left;\"\u003e误判实录：被冤枉的原创\u003c/h2\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e文学经典\u003c/h3\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e62.88%\u003c/strong\u003e\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e朱自清《荷塘月色》被某常用论文检测系统判定“AI生成内容总体疑似度超过六成”。王勃《滕王阁序》甚至被检出AI率接近100%。然而另一检测工具对同样文本的判定为0%。\u003c/p\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e学者亲历\u003c/h3\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e中国人民大学新闻学院副教授\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e董晨宇\u003c/strong\u003e将自己耗时3年扎根基层、追踪多个真实案例写成的秀场直播产业论文提交检测，结果系统标红的“高度疑似AI生成”段落，恰恰是研究团队花费最多心血写成的核心内容。\u003c/p\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e学生困境\u003c/h3\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e广东某高校大四学生\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e张理\u003c/strong\u003e一字一句写了17000字论文，学校平台测出AI率27%（合格），第三方盲审却判定AI率95%。经申诉、提交开题报告和修改记录后，才被修正为32%，惊险过关。\u003c/p\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e平台结果矛盾\u003c/h3\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e湖北某高校学生\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e肖希\u003c/strong\u003e的论文第一次上传知网检测，AI特征值高达71.2%。半小时后重新检测，未做任何修改，AI率骤降至18.4%。“我啥也没做就降了52.8%，这结果真的能信吗？”\u003c/p\u003e\n        \u003csection style=\"font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;max-width:100%;min-width:0;\"\u003e\n          \u003ctable style=\"width:100%;table-layout:fixed;border-collapse:collapse;margin:24px 0 30px;\"\u003e\n            \u003cthead style=\"font-weight: bold; color: #3f3f3f;\"\u003e\u003ctr\u003e\u003cth style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #DFD3E5;overflow-wrap:anywhere;text-align:left;vertical-align:top;background:#F2EAF6;color:#64367B;font-weight:700;width:25.0%;\"\u003e0%\u003c/th\u003e\u003cth style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #DFD3E5;overflow-wrap:anywhere;text-align:left;vertical-align:top;background:#F2EAF6;color:#64367B;font-weight:700;width:25.0%;\"\u003e~100%\u003c/th\u003e\u003cth style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #DFD3E5;overflow-wrap:anywhere;text-align:left;vertical-align:top;background:#F2EAF6;color:#64367B;font-weight:700;width:25.0%;\"\u003e52.8%\u003c/th\u003e\u003cth style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #DFD3E5;overflow-wrap:anywhere;text-align:left;vertical-align:top;background:#F2EAF6;color:#64367B;font-weight:700;width:25.0%;\"\u003e25pp\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n            \u003ctbody\u003e\u003ctr class=\"tr\"\u003e\u003ctd style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #E7DFEC;overflow-wrap:anywhere;text-align:left;vertical-align:top;color:#29262F;width:25.0%;\"\u003e“鉴字源”检测经典文学结果\u003c/td\u003e\u003ctd style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #E7DFEC;overflow-wrap:anywhere;text-align:left;vertical-align:top;color:#29262F;width:25.0%;\"\u003e另一平台检测《滕王阁序》结果\u003c/td\u003e\u003ctd style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #E7DFEC;overflow-wrap:anywhere;text-align:left;vertical-align:top;color:#29262F;width:25.0%;\"\u003e同平台半小时最大波动幅度\u003c/td\u003e\u003ctd style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #E7DFEC;overflow-wrap:anywhere;text-align:left;vertical-align:top;color:#29262F;width:25.0%;\"\u003e不同平台间最大结果差异\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\n          \u003c/table\u003e\n        \u003c/section\u003e\n      \u003ch2 data-kme-heading=\"plain\" style=\"font-size:20px;line-height:1.6;font-weight:700;color:#6A237A;margin:36px 0 18px;padding:0;border:0;background:transparent;text-align:left;\"\u003e工具混战：谁的结果可信？\u003c/h2\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e同一篇论文在不同平台测出天差地别的结果，已成为毕业季的常态。记者实测：用AI生成一篇25000字的论文，各平台检测结果如下——\u003c/p\u003e\n        \u003csection style=\"font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;max-width:100%;min-width:0;\"\u003e\n          \u003ctable style=\"width:100%;table-layout:fixed;border-collapse:collapse;margin:24px 0 30px;\"\u003e\n            \u003cthead style=\"font-weight: bold; color: #3f3f3f;\"\u003e\u003ctr\u003e\u003cth style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #DFD3 ow-wrap:anywhere;text-align:left;vertical-align:top;color:#29262F;width:25.0%;\"\u003e0%\u003c/td\u003e\u003ctd style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #E7DFEC;overflow-wrap:anywhere;text-align:left;vertical-align:top;color:#29262F;width:25.0%;\"\u003e2元/千字\u003c/td\u003e\u003c/tr\u003e\u003ctr class=\"tr\"\u003e\u003ctd style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #E7DFEC;overflow-wrap:anywhere;text-align:left;vertical-align:top;color:#29262F;width:25.0%;\"\u003e万方\u003c/td\u003e\u003ctd style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #E7DFEC;overflow-wrap:anywhere;text-align:left;vertical-align:top;color:#29262F;width:25.0%;\"\u003e60%\u003c/td\u003e\u003ctd style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #E7DFEC;overflow-wrap:anywhere;text-align:left;vertical-align:top;color:#29262F;width:25.0%;\"\u003e0%\u003c/td\u003e\u003ctd style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #E7DFEC;overflow-wrap:anywhere;text-align:left;vertical-align:top;color:#29262F;width:25.0%;\"\u003e2元/千字\u003c/td\u003e\u003c/tr\u003e\u003ctr class=\"tr\"\u003e\u003ctd style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #E7DFEC;overflow-wrap:anywhere;text-align:left;vertical-align:top;color:#29262F;width:25.0%;\"\u003ePaperYY\u003c/td\u003e\u003ctd style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #E7DFEC;overflow-wrap:anywhere;text-align:left;vertical-align:top;color:#29262F;width:25.0%;\"\u003e29%\u003c/td\u003e\u003ctd style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #E7DFEC;overflow-wrap:anywhere;text-align:left;vertical-align:top;color:#29262F;width:25.0%;\"\u003e56.2%\u003c/td\u003e\u003ctd style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #E7DFEC;overflow-wrap:anywhere;text-align:left;vertical-align:top;color:#29262F;width:25.0%;\"\u003e免费平台\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\n          \u003c/table\u003e\n        \u003c/section\u003e\n      \u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e“依靠AI检测AI率，本身就存在不可回避的技术短板——没有统一、公开、可验证的严谨标准，检测方法缺乏科学支撑，检测结果的稳定性、准确性难以保障。”\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e——复旦大学教授 赵斌\u003c/p\u003e\u003c/blockquote\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003eAIGCLINK发起人占冰强从技术原理层面剖析：不同检测工具对同一文本检测结果差异显著，“根源在于检测标准与技术路径的异质性”。由于开发者采用的检测算法、训练数据及评估指标各不相同，各工具构建判断模型时遵循的技术范式与判定逻辑也存在根本差异。\u003c/p\u003e\u003ch2 data-kme-heading=\"plain\" style=\"font-size:20px;line-height:1.6;font-weight:700;color:#6A237A;margin:36px 0 18px;padding:0;border:0;background:transparent;text-align:left;\"\u003e产业链：检测催生的新生意\u003c/h2\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e高校AIGC检测新规落地后，一条完整的灰色产业链迅速成形。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e高校要求AI率低于某指标 → 学生付费检测 → AI率超标 → 寻找“降手”修改/付费AI降重工具 → 再次付费检测\u003c/p\u003e\n        \u003csection style=\"font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;max-width:100%;min-width:0;\"\u003e\n          \u003ctable style=\"width:100%;table-layout:fixed;border-collapse:collapse;margin:24px 0 30px;\"\u003e\n            \u003cthead style=\"font-weight: bold; color: #3f3f3f;\"\u003e\u003ctr\u003e\u003cth style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #DFD3E5;overflow-wrap:anywhere;text-align:left;vertical-align:top;background:#F2EAF6;color:#64367B;font-weight:700;width:25.0%;\"\u003e120+\u003c/th\u003e\u003cth style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #DFD3E5;overflow-wrap:anywhere;text-align:left;vertical-align:top;background:#F2EAF6;color:#64367B;font-weight:700;width:25.0%;\"\u003e720\u003c/th\u003e\u003cth style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #DFD3E5;overflow-wrap:anywhere;text-align:left;vertical-align:top;background:#F2EAF6;color:#64367B;font-weight:700;width:25.0%;\"\u003e50~1000\u003c/th\u003e\u003cth style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #DFD3E5;overflow-wrap:anywhere;text-align:left;vertical-align:top;background:#F2EAF6;color:#64367B;font-weight:700;width:25.0%;\"\u003e~70%\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n            \u003ctbody\u003e\u003ctr class=\"tr\"\u003e\u003ctd style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #E7DFEC;overflow-wrap:anywhere;text-align:left;vertical-align:top;color:#29262F;width:25.0%;\"\u003e知网硕士论文（五万字左右）单次检测费用（元）\u003c/td\u003e\u003ctd style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #E7DFEC;overflow-wrap:anywhere;text-align:left;vertical-align:top;color:#29262F;width:25.0%;\"\u003e反复修改、导师审核、答辩至少检测六次≈半月生活费\u003c/td\u003e\u003ctd style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #E7DFEC;overflow-wrap:anywhere;text-align:left;vertical-align:top;color:#29262F;width:25.0%;\"\u003e“降AI率”服务收费区间（元）\u003c/td\u003e\u003ctd style=\"font-size:12px;line-height:1.8;padding:12px 4px;border:1px solid #E7DFEC;overflow-wrap:anywhere;text-align:left;vertical-align:top;color:#29262F;width:25.0%;\"\u003e近七成大学生用AI写论文/作业\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\n          \u003c/table\u003e\n        \u003c/section\u003e\n      \u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e用AI写作、用AI检测AI率、用AI降AI，这个链条里\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e“反向洗稿”\u003c/strong\u003e的蔓延：南京师范大学教授乔雪峰发现，学生们开始刻意把通顺的句子改得拗口，把准确的学术词汇替换为生僻词，甚至故意制造语病以躲避检测。“这样的论文，即便骗过了机器，又有何意义？”\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e除了“降手”之外，目前很多平台，比如知网、PaperPass等，也有“一键降AI”的服务\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e检测AI率和降AI率，本是水火不容的两件事，如今却出现在同一家平台的同一个页面上。一边用「学术诚信」的名义收紧标准，一边明码标价出售规避服务，这种左手出题、右手卖答案的模式，本质上是把「AI率」变成了收费闸门。当毕业资格与一项商业检测结果挂钩，而降低检测结果又恰好是同一家公司的付费产品，学生面对的并不是学术评判，而是一道「交钱通过、不交重来」的付费关卡。\u003c/p\u003e\u003ch2 data-kme-heading=\"plain\" style=\"font-size:20px;line-height:1.6;font-weight:700;color:#6A237A;margin:36px 0 18px;padding:0;border:0;background:transparent;text-align:left;\"\u003e学界声音：专家怎么看？\u003c/h2\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e占冰强 · AIGCLINK发起人\u003c/h3\u003e\u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e“从技术本质与实践困境来看，当前AI检测技术尚未成熟，甚至可被视为伪命题。AI生成与人类写作的边界愈发模糊，现有检测模型普遍存在方法论局限。”\u003c/p\u003e\u003c/blockquote\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e时世平 · 《天津社会科学》主编\u003c/h3\u003e\u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e“学术写作追求语言规范与AI生成逻辑高度重合。应重视作者原创声明环节，明确AI检测的辅助而非唯一决定功用，完善同行评议和专家审核机制。”\u003c/p\u003e\u003c/blockquote\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e陈阳 · 复旦大学教授\u003c/h3\u003e\u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e“大模型用人类语料训练，生成内容与人类创作客观上可能雷同。AI检测难度远大于传统论文查重，不论名家名篇还是用户原创，完全可能被误判。”\u003c/p\u003e\u003c/blockquote\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e乔雪峰 · 南京师范大学教授\u003c/h3\u003e\u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e“看AI率不是为了抓小偷，而是提醒学生：应通过和AI的深度协同，杜绝流水线式的机器味，打磨出严谨独到的学术味；守住学术诚信和能力达成两条底线。”\u003c/p\u003e\u003c/blockquote\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e董晨宇 · 中国人民大学副教授\u003c/h3\u003e\u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e“AI已成为重要学术辅助工具，教师应积极引导学生合理运用。学术考核机制需从结果导向转向过程导向，构建人机协同的研究范式，明确人类在学术创造中的主导地位。”\u003c/p\u003e\u003c/blockquote\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e刘方喜 · 中国社科院研究员\u003c/h3\u003e\u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e“伴随技术迭代加速，未来无论是专家经验判断还是软件检测，都难以精准区分AI与人类原创。需建立复合型审核机制，包括AI使用声明制度、负面清单管理等。”\u003c/p\u003e\u003c/blockquote\u003e\u003ch2 data-kme-heading=\"plain\" style=\"font-size:20px;line-height:1.6;font-weight:700;color:#6A237A;margin:36px 0 18px;padding:0;border:0;background:transparent;text-align:left;\"\u003e出路在何方？\u003c/h2\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e2026年5月14日，中国学位与研究生教育学会数智教育管理工作委员会牵头发布了《\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e规范研究生学位论文与实践成果中人工智能工具使用指南\u003c/strong\u003e》，要求学生主动出具“人工智能使用声明”，对工具名称、使用环节、参数设置等进行全面披露，并在答辩环节设置AI使用质询程序。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e但更多学者认为，仅靠“事后检测”远远不够。学术界正在形成几大共识方案：\u003c/p\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003eAI使用声明制度\u003c/h3\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e学生在论文中主动披露AI工具的使用情况，过程可追溯、结果可核验。\u003c/p\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e过程导向评估\u003c/h3\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e考核机制从只看最终文本转向关注研究过程，导师对学生日常水平和研究过程最了解，专业判断优于任何模型。\u003c/p\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e以创新性评估为核心\u003c/h3\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e与其纠结字词句是否有“AI味”，不如看论文是否有独立思考、创新观点，研究方法是否恰当，数据和结论是否可靠。\u003c/p\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e人机协同机制\u003c/h3\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003eAI可介入学术生产与评价流程，但作用和功能只能是辅助性的。人类在学术创造中的主导地位不可替代。\u003c/p\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e统一行业标准\u003c/h3\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e建立统一的AI检测行业标准与多场景验证机制，分门别类设定符合各学科特征的AI检测相似度阈值。\u003c/p\u003e\u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e“AI检测工具给出的数据，只能是一种参考。能为论文打出公正分的，是导师、是审稿人，而不是任何一种AI工具。”\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e——科技日报评论\u003c/p\u003e\u003c/blockquote\u003e\u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e“让AI检测AI，本质上还是一种技术迷信。它可能迫使原创作者为降低AI率而进行无意义的修改，最终产出平庸甚至糟糕的文本。我们要培养的，不是能通过AI检测的写手，而是具备独立思考能力和创新思维的人。”\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e——科技日报 · 张盖伦\u003c/p\u003e\u003c/blockquote\u003e\n    \n  \n    \n  \n    \n  \u003c/section\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\u003c/section\u003e\u003c/article\u003e\u003c/body\u003e\u003c/html\u003e","number":3},{"id":"wx-04","channel":"wechat","title":"AIGC检测原理","cover":"img/08_4dc23e24e0.png","html":"\u003c!doctype html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\u003ctitle\u003eAIGC检测原理\u003c/title\u003e\u003cstyle\u003ebody{margin:0;background:#fff;color:#29262F;font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",sans-serif}*{box-sizing:border-box}article{max-width:680px;margin:auto;padding:24px 20px 36px;overflow-wrap:anywhere;font-size:17px;line-height:1.95}img{max-width:100%;height:auto}a{color:#7C4892;overflow-wrap:anywhere}p:has(img){text-align:left!important}blockquote p{text-align:left!important}table{max-width:100%}table p{font-size:inherit!important;line-height:1.8!important;margin:0!important}table span{font-size:inherit!important}h1,h2,h3{white-space:normal;overflow-wrap:anywhere;word-break:normal}h2,h3{break-after:avoid}@media(max-width:360px){article{padding-left:16px;padding-right:16px}h1{font-size:25px!important}}\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\u003carticle data-kme-layout=\"wechat-unified-v2\"\u003e\u003ch1 style=\"font-size:28px;line-height:1.5;font-weight:700;color:#29262F;margin:0 0 20px;padding:0;border:0;background:transparent;text-align:left;\"\u003eAIGC检测原理\u003c/h1\u003e\u003csection data-unified-body=\"true\"\u003e\u003csection data-original-transcript style=\"font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;max-width:100%;min-width:0;\"\u003e\n  \u003cdiv id=\"output\" style=\"font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;max-width:100%;min-width:0;\"\u003e\n\u003csection class=\"container\" style=\"font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;max-width:100%;min-width:0;\"\u003e\u003cp style=\"margin:0 0 26px;padding:0;text-align:left;\"\u003e\u003cimg src=\"img/08_4dc23e24e0.png\" alt=\"本文主题封面\" style=\"display:block;width:100%;height:auto;margin:0;border:0;border-radius:0;\"\u003e\u003c/p\u003e\u003ch2 data-kme-heading=\"plain\" style=\"font-size:20px;line-height:1.6;font-weight:700;color:#6A237A;margin:36px 0 18px;padding:0;border:0;background:transparent;text-align:left;\"\u003eAIGC检测原理\u003c/h2\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e目前大部分AIGC检测的平台（知网、维普等）所使用的核心原理是检测\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e困惑度（Perplexity）与突发度（Burstiness）\u003c/strong\u003e。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e困惑度是指衡量一段文本的“令人惊讶的程度”，即如果一篇文章的用词完全符合AI保留Token的概率，则其极有可能为AI生成的；\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e突发度则是衡量句子的结构和长度的变化，如果是AI生成的文字，通常其句子的节奏是稳定的，长短句分布均匀，而人类写作的长难句与短句的分布是不定的，即如果文章的节奏固定，则其更可能被判定为AIGC。\u003c/p\u003e\u003ch2 data-kme-heading=\"plain\" style=\"font-size:20px;line-height:1.6;font-weight:700;color:#6A237A;margin:36px 0 18px;padding:0;border:0;background:transparent;text-align:left;\"\u003e降AI可行吗？\u003c/h2\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e用AI降重工具去降AIGC，本质上\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e无法更改\u003c/strong\u003e文本的困惑度与突发度，降低论文的AIGC（AI生成内容）检测率，核心在于打破AI生成的模式化特征，即增加困惑度与突发度。\u003c/p\u003e\u003ch2 data-kme-heading=\"plain\" style=\"font-size:20px;line-height:1.6;font-weight:700;color:#6A237A;margin:36px 0 18px;padding:0;border:0;background:transparent;text-align:left;\"\u003e如何降AIGC率\u003c/h2\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e标点符号与关联词\u003c/h3\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003eAI会有比较固定的句式，包括长短句的节奏、关联词的使用。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e如AI常使用“首先，其次，另外，此外，因此”这些关联词，而且常用逗号隔开，因此可以修改或删除关联词，并删除标点符号。\u003c/p\u003e\u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e原文：因此，学界普遍认为适度且科学的体育活动能够显著提升人体的免疫功能，增强心肺功能，优化身体素质。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e改写为：学界普遍认为适度且科学的体育活动能够显著提升人体的免疫功能，增强心肺功能并优化身体素质\u003c/p\u003e\u003c/blockquote\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e主语\u003c/h3\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003eAI所写句子经常缺少主语，在降AI时需要把句子的主语补上，如“\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e学界普遍认为……\u003c/strong\u003e”、“\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e研究人员认为\u003c/strong\u003e”、“\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003exxx指出...\u003c/strong\u003e”等。\u003c/p\u003e\u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e原文：研究发现，从2010年到2018年，身体活动不足呈增加趋势。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e改写为：研究发现从2010年到2018年，中国成年人的身体活动不足呈增加趋势。\u003c/p\u003e\u003c/blockquote\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e同义词替换\u003c/h3\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e在人写的文章中，同一个意思的词语经常使用不同的同义词来表达，AI则是反复使用同一词语，在修改时可以将一个段落中的重复词替换掉，尽量丰富表达。\u003c/p\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e加入例子\u003c/h3\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003eAI写的文章经常看似非常有道理有逻辑，但其内容其实非常空洞，没有实质性内容，是车轱辘话来回说，修改时可以加入例子、真实文献内容或自己的实验数据、结论，既可以增加字数也可以破坏单个段落中的AI结构。\u003c/p\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e增加“错误”\u003c/h3\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003eAI追求极致的效率，而人类说话会有一些辅助性的修饰或细节描述，甚至是语病。降AI时可以适当增加语病以及一些“废话”，或者使用口语化表达。\u003c/p\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e翻译\u003c/h3\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e将段落翻译成其它语言（如英语、德语、日语），再翻回中文，破坏AI生成句子的固定语序，可以有效降低AI率，适合大片文字为AI生成且时间紧迫的情况。\u003c/p\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e自己复述\u003c/h3\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e对于表达意思重要、涉及论文核心观点的段落，无法修改AIGC文本时，可以尝试自己复述这段话，假装向别人介绍你研究的课题和你的想法，重新表述。\u003c/p\u003e\u003ch2 data-kme-heading=\"plain\" style=\"font-size:20px;line-height:1.6;font-weight:700;color:#6A237A;margin:36px 0 18px;padding:0;border:0;background:transparent;text-align:left;\"\u003e总结\u003c/h2\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e另外还要说的是我看到很多人因为查AI率的要求非常焦虑，害怕自己写的内容也被判别为AI，其实完全不用担心！现在的AIGC检测的准确率已经可以达到90%以上了。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e特别是学校如果有要求AIGC率，那肯定会选择靠谱的平台，所以大家真的不必要因为免费平台测出来的虚高数值焦虑..\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e我用paperpass测出来44%，我自己知道绝对不可能这么高，就直接花钱在知网测了，才24%\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e所以！真的不要用免费的平台去测！更不要用免费平台的结果作为参考去修改！\u003c/p\u003e\n    \n  \n    \n  \n    \n  \u003c/section\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\u003c/section\u003e\u003c/article\u003e\u003c/body\u003e\u003c/html\u003e","number":4},{"id":"wx-05","channel":"wechat","title":"学术期刊集体发布AI要求，不能再用AI辅助写论文了？","cover":"img/09_cb9b31b8dc.png","html":"\u003c!doctype html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\u003ctitle\u003e学术期刊集体发布AI要求，不能再用AI辅助写论文了？\u003c/title\u003e\u003cstyle\u003ebody{margin:0;background:#fff;color:#29262F;font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",sans-serif}*{box-sizing:border-box}article{max-width:680px;margin:auto;padding:24px 20px 36px;overflow-wrap:anywhere;font-size:17px;line-height:1.95}img{max-width:100%;height:auto}a{color:#7C4892;overflow-wrap:anywhere}p:has(img){text-align:left!important}blockquote p{text-align:left!important}table{max-width:100%}table p{font-size:inherit!important;line-height:1.8!important;margin:0!important}table span{font-size:inherit!important}h1,h2,h3{white-space:normal;overflow-wrap:anywhere;word-break:normal}h2,h3{break-after:avoid}@media(max-width:360px){article{padding-left:16px;padding-right:16px}h1{font-size:25px!important}}\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\u003carticle data-kme-layout=\"wechat-unified-v2\"\u003e\u003ch1 style=\"font-size:28px;line-height:1.5;font-weight:700;color:#29262F;margin:0 0 20px;padding:0;border:0;background:transparent;text-align:left;\"\u003e学术期刊集体发布AI要求，不能再用AI辅助写论文了？\u003c/h1\u003e\u003csection data-unified-body=\"true\"\u003e\u003csection data-original-transcript style=\"font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;max-width:100%;min-width:0;\"\u003e\n  \u003cdiv id=\"output\" style=\"font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;max-width:100%;min-width:0;\"\u003e\n\u003csection class=\"container\" style=\"font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;max-width:100%;min-width:0;\"\u003e\u003cp style=\"margin:0 0 26px;padding:0;text-align:left;\"\u003e\u003cimg src=\"img/09_cb9b31b8dc.png\" alt=\"本文主题封面\" style=\"display:block;width:100%;height:auto;margin:0;border:0;border-radius:0;\"\u003e\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e近期，中国科技期刊卓越行动计划入选期刊及集群联合发布了维护学术诚信的倡议，其中提出了对于规范人工智能运用的要求。\u003c/p\u003e\u003ch2 data-kme-heading=\"plain\" style=\"font-size:20px;line-height:1.6;font-weight:700;color:#6A237A;margin:36px 0 18px;padding:0;border:0;background:transparent;text-align:left;\"\u003e规范人工智能应用，明确使用边界\u003c/h2\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e该倡议指出，应当“规范人工智能应用，明确使用边界。严格规范人工智能技术在科研活动和学术出版中的辅助性应用，建立健全人工智能使用披露制度，\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e主动声明人工智能工具的具体用途及介入程度\u003c/strong\u003e，确保学术贡献归属清晰、责任可追溯。”\u003c/p\u003e\u003cp style=\"margin:0 0 12px;padding:0;text-align:left;\"\u003e\u003cimg src=\"img/10_df36ca7630.png\" alt=\"原素材所附：中国科技期刊卓越行动计划维护学术诚信倡议截图\" style=\"display:block;width:100%;height:auto;margin:0;border:0;border-radius:0;\"\u003e\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e其实，这不是第一次对科研和学术出版中的AI应用规定边界，许多期刊和出版机构就已对AI辅助研究、文本生成、作者署名等问题作出过限制或披露要求。\u003c/p\u003e\u003ch2 data-kme-heading=\"plain\" style=\"font-size:20px;line-height:1.6;font-weight:700;color:#6A237A;margin:36px 0 18px;padding:0;border:0;background:transparent;text-align:left;\"\u003e《中国经济问题》\u003c/h2\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e8月8日，《中国经济问题》编辑部发布了《关于生成式人工智能使用的声明》\u003c/p\u003e\u003cp style=\"margin:0 0 12px;padding:0;text-align:left;\"\u003e\u003cimg src=\"img/11_8242761995.png\" alt=\"原素材所附：《中国经济问题》关于生成式人工智能使用的声明截图\" style=\"display:block;width:100%;height:auto;margin:0;border:0;border-radius:0;\"\u003e\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e声明中对投稿作者、审稿专家以及编辑人员都提出了具体的要求，中心内容可以总结为：\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003eAI只能用于辅助性工作，不能替代作者、审稿专家和编辑人员的核心专业判断与责任；涉及未公开内容必须保密，实质性使用AI必须如实披露，相关责任由人承担。\u003c/strong\u003e\u003c/p\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e投稿作者\u003c/h3\u003e\u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e论文的研究设计、理论观点、论证逻辑、数据分析和研究结论等核心学术内容应由作者独立完成，AI不得替代作者开展实质性研究和学术判断。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e作者可将AI用于文献检索辅助、文字校对、语言润色和格式整理等辅助性工作，但不得利用AI伪造、篡改数据、案例、文献或研究结果。对研究和论文写作产生实质性影响的AI使用，应在投稿时如实说明所使用的工具、用途及范围。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e作者对稿件的原创性、真实性、准确性和合规性承担全部责任。因不当使用AI造成学术不端、知识产权纠纷或其他问题的，本刊将依据相关规定作相应处理。\u003c/p\u003e\u003c/blockquote\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e审稿专家\u003c/h3\u003e\u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e审稿专家应基于专业知识和学术判断独立完成评审，不得由AI替代专家进行实质性审稿。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e审稿专家应严格履行保密义务，不得将未公开稿件、数据及审稿材料上传至公开或存在信息泄露风险的AI平台。\u003c/p\u003e\u003c/blockquote\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e编辑人员\u003c/h3\u003e\u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e编辑人员在稿件初审、复审、编校和终审过程中，应坚持人工审慎判断，AI不得替代编辑人员对稿件政治导向、学术质量、研究伦理和出版规范的专业审核。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e在确保信息安全的前提下，可适当使用AI开展文字校对、格式检查和语言优化等辅助工作，但不得利用AI擅自修改论文核心观点、研究结果及重要论证，不得将未公开稿件和审稿信息上传至公开AI平台。\u003c/p\u003e\u003c/blockquote\u003e\u003ch2 data-kme-heading=\"plain\" style=\"font-size:20px;line-height:1.6;font-weight:700;color:#6A237A;margin:36px 0 18px;padding:0;border:0;background:transparent;text-align:left;\"\u003e广东财经大学期刊中心\u003c/h2\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e广东财经大学期刊中心发布了覆盖《广东财经大学学报》《智能高教》《法商高教研究》三本刊物的统一声明，约束范围包括投稿作者、外审专家和编辑部全员。\u003c/p\u003e\u003cp style=\"margin:0 0 12px;padding:0;text-align:left;\"\u003e\u003cimg src=\"img/12_f5ffe3c3bd.png\" alt=\"原素材所附：广东财经大学期刊中心关于生成式人工智能（AIGC）使用统一声明截图\" style=\"display:block;width:100%;height:auto;margin:0;border:0;border-radius:0;\"\u003e\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e广东财经大学期刊中心的声明更近了一步，提出对于不符合规范要求的论文将\u003cstrong style=\"font-weight:700;color:#7C4892;\"\u003e撤稿并纳入学术失信记录\u003c/strong\u003e\u003c/p\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e对投稿作者的规范要求\u003c/h3\u003e\u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e论文核心研究内容须由作者独立完成，研究设计、理论观点、论证逻辑、实证分析、调研数据、研究结论等核心学术内容，严禁由AIGC主导生成、拼接改写、洗稿重构。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003eAIGC仅可用于文献检索、参考文献规整、文字校对、语句润色、图表排版等辅助性事务工作，严禁借助AIGC伪造、篡改调研样本、原始数据、案例资料、文献原文与实证结果。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e论文写作过程中凡使用AIGC工具，作者须在投稿时主动、完整如实披露，清晰注明工具名称、版本、使用场景及使用范围，同步留存人机交互记录以备核查，严禁隐瞒不报、虚假填报。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e全体署名作者对稿件原创性、数据真实性、内容合规性承担全部学术责任与法律责任。投稿后核查发现存在AIGC违规使用、刻意隐瞒等情形，本刊将依规作退稿处理；已刊发稿件予以撤稿，同步纳入期刊学术失信记录，并通报作者所属单位科研管理部门。\u003c/p\u003e\u003c/blockquote\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e对外审专家的规范要求\u003c/h3\u003e\u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e审稿意见须由专家独立研判、手工撰写完成，严禁完全或主要依靠AIGC生成评审结论与修改建议，不得产出模板化、无实质性判断的AI审稿意见。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e严格遵守审稿保密管理规定，严禁将待审稿件全文、片段、核心数据上传至各类公开AIGC平台，严防未刊发学术成果泄密。\u003c/p\u003e\u003c/blockquote\u003e\u003ch3 style=\"font-size:17px;line-height:1.7;font-weight:700;color:#7C4892;margin:26px 0 12px;padding:0;border:0;background:transparent;text-align:left;\"\u003e对编辑部人员的规范要求\u003c/h3\u003e\u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e期刊三审三校全流程坚持人工学术把关为主，以人工研判把控稿件政治导向、学术质量、科研伦理，不得依赖AIGC替代编辑专业审核判断。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e编辑仅可有限使用AIGC开展文字校对、格式统一、参考文献规整等辅助编校工作；严禁借助AIGC修改论文核心观点、实证逻辑、政策结论，严禁将涉密调研资料、未公开发表文稿输入公开AI平台。\u003c/p\u003e\u003c/blockquote\u003e\u003ch2 data-kme-heading=\"plain\" style=\"font-size:20px;line-height:1.6;font-weight:700;color:#6A237A;margin:36px 0 18px;padding:0;border:0;background:transparent;text-align:left;\"\u003e《职业技术教育》\u003c/h2\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e《职业技术教育》关于规范使用生成式人工智能工具的声明更进一步，覆盖了投稿、审稿、修改、编辑、出版全过程。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e提出了禁止使用AI的8种情况\u003c/p\u003e\u003cp style=\"margin:0 0 12px;padding:0;text-align:left;\"\u003e\u003cimg src=\"img/13_6b90588bd7.png\" alt=\"原素材所附：《职业技术教育》禁止使用的情形截图\" style=\"display:block;width:100%;height:auto;margin:0;border:0;border-radius:0;\"\u003e\u003c/p\u003e\u003cblockquote style=\"margin:23px 0 28px;padding:18px 15px 1px;border-left:3px solid #7C4892;background:#F7F3F9;\"\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:left;\"\u003e本刊不接受由生成式人工智能工具独立撰写或者以生成内容为主体的稿件。作者不得使用生成式人工智能工具代替自身完成研究问题提出、理论框架建构、核心观点形成、主要内容撰写、研究结果解释和学术结论提炼等创造性工作。严禁利用生成式人工智能工具实施下列行为：\u003c/p\u003e\u003col class=\"ol\" style=\"margin:0 0 23px;padding-left:24px;\"\u003e\u003cli class=\"listitem\" style=\"font-size:17px;line-height:1.95;margin:0 0 12px;padding-left:2px;\"\u003e1. 生成论文主体架构、核心观点、主要内容或研究结论，并将其直接或者简单修改后作为作者原创成果投稿；\u003c/li\u003e\u003cli class=\"listitem\" style=\"font-size:17px;line-height:1.95;margin:0 0 12px;padding-left:2px;\"\u003e2. 虚构、篡改或者拼接研究数据、调查结果、访谈资料、案例材料、政策文本、实验记录及其他研究证据；\u003c/li\u003e\u003cli class=\"listitem\" style=\"font-size:17px;line-height:1.95;margin:0 0 12px;padding-left:2px;\"\u003e3. 生成不存在的文献，篡改文献作者、题名、刊名、年份、卷期、页码等信息，或者引用未经核验的文献；\u003c/li\u003e\u003cli class=\"listitem\" style=\"font-size:17px;line-height:1.95;margin:0 0 12px;padding-left:2px;\"\u003e4. 改写、拼接或者变相复制他人已发表或未发表的研究成果，规避重复率检测和学术不端审查；\u003c/li\u003e\u003cli class=\"listitem\" style=\"font-size:17px;line-height:1.95;margin:0 0 12px;padding-left:2px;\"\u003e5. 使用生成式人工智能工具伪造、修饰或者篡改具有证据性质的图片、图表、音频、视频及其他研究材料；\u003c/li\u003e\u003cli class=\"listitem\" style=\"font-size:17px;line-height:1.95;margin:0 0 12px;padding-left:2px;\"\u003e6. 隐瞒、虚报或者不完整披露生成式人工智能工具的使用情况；\u003c/li\u003e\u003cli class=\"listitem\" style=\"font-size:17px;line-height:1.95;margin:0 0 12px;padding-left:2px;\"\u003e7. 将生成式人工智能生成的内容作为未经核验的事实依据或主要文献来源；\u003c/li\u003e\u003cli class=\"listitem\" style=\"font-size:17px;line-height:1.95;margin:0 0 12px;padding-left:2px;\"\u003e8. 其他违反学术伦理、出版规范、数据安全、隐私保护和知识产权规定的行为。\u003c/li\u003e\u003c/ol\u003e\u003c/blockquote\u003e\u003ch2 data-kme-heading=\"plain\" style=\"font-size:20px;line-height:1.6;font-weight:700;color:#6A237A;margin:36px 0 18px;padding:0;border:0;background:transparent;text-align:left;\"\u003e人类主体、全程负责\u003c/h2\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e通读几篇倡议、声明之后，其实可以发现，并没有一篇内容是提出了“完全禁止使用AI”，而是纷纷界定了使用AI的边界。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e这对于作者来说，其实是好事。表面上看，多了披露要求和留痕义务，似乎增加了投稿负担，但实际上是在为作者划清安全边界：哪些环节可以用AI、哪些必须由人独立完成，避免了因使用不当而误触学术不端红线。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e同时，要求核实文献、数据和引文，正好防止作者被AI的“一本正经胡说”带偏，降低因虚假文献、篡改数据导致的撤稿风险。\u003c/p\u003e\u003cp style=\"font-size:17px;line-height:1.95;margin:0 0 23px;color:#29262F;overflow-wrap:anywhere;text-align:justify;\"\u003e以“人类主体、全程负责”为原则，把署名权和学术责任放在人身上，既保护了作者的原创贡献，也让规范使用AI的作者有据可查、有章可循，在公平的规则下竞争。\u003c/p\u003e\n    \n  \n    \n  \n    \n  \u003c/section\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\u003c/section\u003e\u003c/article\u003e\u003c/body\u003e\u003c/html\u003e","number":5}]}</script>

  function prepare(doc, run) {
    const make = (tag, className, text) => {
      const element = doc.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    };
    const icon = (name) => {
      const svg = doc.createElementNS('http://www.w3.org/2000/svg','svg');
      for (const [key,value] of Object.entries({viewBox:'0 0 24 24',fill:'none',stroke:'currentColor','stroke-width':'1.7','stroke-linecap':'round','stroke-linejoin':'round','aria-hidden':'true'})) svg.setAttribute(key,value);
      const path = doc.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',icons[name]);svg.append(path);return svg;
    };
    const style = make('style');style.textContent=css;(doc.head || doc.body).append(style);
    if (run.channel !== 'xiaohongshu_official') {
      const nav=make('div','wx-native-nav');nav.setAttribute('aria-hidden','true');
      nav.append(icon('back'),make('span','','公众号'),icon('more'));doc.body.prepend(nav);
      return;
    }
    const original = doc.querySelector('article') || doc.body;
    const title = original.querySelector('h1') || make('h1','',run.title || '笔记草稿');
    const images = [...original.querySelectorAll('img')];
    const children = [...original.children];
    const bodyStart = children.findIndex(child=>child.tagName.toLowerCase()==='h2' && child.textContent.trim()==='笔记正文');
    const content=[];
    if (bodyStart>=0) {
      for (const child of children.slice(bodyStart+1)) {
        if (child.tagName.toLowerCase()==='h2') break;
        content.push(child);
      }
    }
    const app=make('div','xhs-app');
    const header=make('header','xhs-header');header.setAttribute('aria-label','笔记作者区域');
    const follow=make('span','xhs-follow','关注');follow.setAttribute('aria-hidden','true');
    // Keep the account avatar outside doc.images so card feedback indexes stay stable.
    const avatar=make('span','xhs-avatar');avatar.setAttribute('role','img');avatar.setAttribute('aria-label','KME开明AIGC检测头像');
    avatar.style.backgroundImage='url("'+new URL("img/01_8b25843607.png",window.location.href).href+'")';
    header.append(icon('back'),avatar,make('span','xhs-author','KME开明AIGC检测'),follow,icon('share'));
    const scroll=make('div','xhs-scroll');
    const shell=make('div','xhs-gallery-shell');
    const gallery=make('div','xhs-gallery');gallery.tabIndex=0;gallery.setAttribute('role','region');gallery.setAttribute('aria-label','笔记图片，可左右滑动');
    images.forEach((image,index)=>{
      const slide=make('figure','xhs-slide');slide.setAttribute('aria-label','第'+(index+1)+'张图片');
      image.draggable=false;slide.append(image);gallery.append(slide);
    });
    const counter=make('span','xhs-page-count');counter.setAttribute('aria-live','polite');
    const previous=make('button','xhs-arrow xhs-arrow-prev','‹');previous.type='button';previous.setAttribute('aria-label','上一张图片');
    const next=make('button','xhs-arrow xhs-arrow-next','›');next.type='button';next.setAttribute('aria-label','下一张图片');
    const dots=make('div','xhs-dots');
    let active=0;
    const update=()=>{
      active=Math.min(images.length-1,Math.max(0,Math.round(gallery.scrollLeft/Math.max(1,gallery.clientWidth))));
      counter.textContent=(active+1)+'/'+images.length;previous.disabled=active===0;next.disabled=active===images.length-1;
      [...dots.children].forEach((dot,index)=>{dot.classList.toggle('is-active',index===active);dot.setAttribute('aria-pressed',String(index===active));});
    };
    const go=(index)=>{gallery.scrollTo({left:Math.max(0,Math.min(images.length-1,index))*gallery.clientWidth,behavior:'smooth'});};
    images.forEach((_,index)=>{const dot=make('button','xhs-dot');dot.type='button';dot.setAttribute('aria-label','查看第'+(index+1)+'张图片');dot.addEventListener('click',()=>go(index));dots.append(dot);});
    previous.addEventListener('click',()=>go(active-1));next.addEventListener('click',()=>go(active+1));gallery.addEventListener('scroll',update);
    gallery.addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();go(active+(event.key==='ArrowLeft'?-1:1));}});
    let start=null, moved=false;
    gallery.addEventListener('pointerdown',event=>{start={x:event.clientX,y:event.clientY,left:gallery.scrollLeft};moved=false;});
    gallery.addEventListener('pointermove',event=>{if(!start)return;const dx=event.clientX-start.x;if(Math.abs(dx)>8)moved=true;if(event.pointerType==='mouse' && moved){event.preventDefault();gallery.scrollLeft=start.left-dx;}});
    gallery.addEventListener('pointerup',()=>{start=null;});gallery.addEventListener('pointercancel',()=>{start=null;});
    gallery.addEventListener('click',event=>{if(moved){event.preventDefault();event.stopPropagation();moved=false;}},true);
    gallery.addEventListener('dragstart',event=>event.preventDefault());
    if(images.length){shell.append(gallery,counter,previous,next);scroll.append(shell,dots);update();}
    else scroll.append(make('div','xhs-no-images','图片制作中'));
    const copy=make('article','xhs-copy');copy.setAttribute('data-feedback-content','');title.className='xhs-note-title';copy.append(title,...content);
    copy.querySelectorAll('p').forEach(p=>{if(p.textContent.trim().startsWith('#'))p.classList.add('xhs-tags');});
    copy.append(make('div','xhs-draft-mark','内容预览 · 待确认'));scroll.append(copy);
    const bottom=make('div','xhs-bottom');bottom.setAttribute('aria-label','App互动栏外观');
    bottom.append(make('span','xhs-comment-placeholder','说点什么…'));
    for(const [name,label] of [['heart','点赞'],['star','收藏'],['comment','评论']]){const item=make('span','xhs-bottom-item');item.append(icon(name),make('span','',label));bottom.append(item);}
    app.append(header,scroll,bottom);doc.body.replaceChildren(app);doc.body.className='xhs-body';doc.documentElement.classList.add('xhs-root');
  }
  function fit() {
    const phone=document.getElementById('reader-document');
    if(!phone || phone.hidden || !phone.getBoundingClientRect || !window.getComputedStyle)return;
    const styles=window.getComputedStyle(phone);
    const padding=parseFloat(styles.paddingLeft) || 0;
    const available=phone.clientWidth-padding*2;
    if(available<=0)return;
    const scale=available/390;
    phone.style.setProperty('--phone-scale',String(scale));
    phone.style.height=(844*scale+padding*2+2)+'px';
  }
  window.WorkbenchMobile={prepare,fit};
  window.addEventListener('resize',fit);
  if(window.ResizeObserver){const observer=new window.ResizeObserver(fit);const phone=document.getElementById('reader-document');if(phone)observer.observe(phone);}
}());
</script>
  <script>(function(){
  'use strict';
  const $=id=>document.getElementById(id);
  const labels={wechat:'微信公众号'};
  let items=[],filter='all',active=null;
  const make=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
  const visible=()=>items.filter(row=>filter==='all'||row.channel===filter);
  function renderList(){
    const nav=$('notes'),picker=$('note-picker');nav.replaceChildren();picker.replaceChildren();
    for(const row of visible()){
      const link=make('a','note-link');link.href='#'+row.id;if(row===active)link.setAttribute('aria-current','page');
      const img=make('img','note-thumb');img.src=row.cover;img.alt='';img.loading='lazy';
      const info=make('span','note-info');info.append(make('strong','',row.title),make('small','',labels[row.channel]+' · '+String(row.number).padStart(2,'0')));link.append(img,info);nav.append(link);
      const option=make('option','',labels[row.channel]+' · '+row.title);option.value=row.id;option.selected=row===active;picker.append(option);
    }
    document.querySelectorAll('[data-filter]').forEach(button=>{const selected=button.dataset.filter===filter;button.classList.toggle('active',selected);button.setAttribute('aria-pressed',String(selected));});
  }
  function render(){
    active=items.find(row=>row.id===location.hash.slice(1))||visible()[0]||items[0];
    if(filter!=='all'&&active.channel!==filter)filter='all';
    renderList();
    $('note-title').textContent=active.title;$('platform').textContent=labels[active.channel];
    const index=items.indexOf(active),total=String(items.length).padStart(2,'0');$('position').textContent=String(index+1).padStart(2,'0')+' / '+total;$('current-note').textContent=String(index+1).padStart(2,'0')+' / '+total;
    $('previous-note').disabled=index===0;$('next-note').disabled=index===items.length-1;
    $('reader-help').textContent=active.channel==='wechat'?'在预览内上下滚动，阅读全文':'左右切换图片，在预览内上下阅读笔记';
    const frame=make('iframe','article-frame');frame.title=active.title;frame.setAttribute('sandbox','allow-same-origin');frame.setAttribute('referrerpolicy','no-referrer');
    const selected=active;
    frame.addEventListener('load',()=>{window.WorkbenchMobile.prepare(frame.contentDocument,selected);});
    const base=document.createElement('base');base.href=new URL('./',location.href).href;base.target='_blank';
    frame.srcdoc=active.html.replace(/<head(?:\s[^>]*)?>/i,head=>head+base.outerHTML);
    $('phone-viewport').replaceChildren(frame);$('reader-document').hidden=false;window.WorkbenchMobile.fit();
    document.title=active.title+' · KME开明客户预览';
  }
  $('note-picker').addEventListener('change',()=>{location.hash=$('note-picker').value;});
  document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.filter;const rows=visible();if(!rows.includes(active))location.hash=rows[0].id;else renderList();}));
  $('previous-note').addEventListener('click',()=>{const index=items.indexOf(active);if(index>0)location.hash=items[index-1].id;});
  $('next-note').addEventListener('click',()=>{const index=items.indexOf(active);if(index<items.length-1)location.hash=items[index+1].id;});
  window.addEventListener('hashchange',()=>{if(items.length)render();});
  Promise.resolve(JSON.parse(document.getElementById('offline-content').textContent)).then(data=>{items=data.items;if(items.length!==5||items.some(row=>row.channel!=='wechat'))throw new Error('edition incomplete');render();}).catch(()=>{$('note-title').textContent='内容暂时无法载入';$('load-error').textContent='请刷新页面后重试。';$('load-error').hidden=false;});
}());
